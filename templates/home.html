<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Donation Hub - Make a Difference</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
}

/* Animated Background Particles */
body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
    border-radius: 50%;
    top: -200px;
    right: -200px;
    animation: float 8s ease-in-out infinite;
}

body::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
    border-radius: 50%;
    bottom: -150px;
    left: -150px;
    animation: float 10s ease-in-out infinite reverse;
}

@keyframes float {
    0%, 100% { 
        transform: translateY(0px) rotate(0deg) scale(1); 
    }
    50% { 
        transform: translateY(-30px) rotate(5deg) scale(1.05); 
    }
}

/* Floating particles */
.particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    pointer-events: none;
    animation: rise 15s infinite ease-in;
}

.particle:nth-child(1) { width: 10px; height: 10px; left: 10%; animation-delay: 0s; }
.particle:nth-child(2) { width: 15px; height: 15px; left: 25%; animation-delay: 3s; }
.particle:nth-child(3) { width: 8px; height: 8px; left: 50%; animation-delay: 1s; }
.particle:nth-child(4) { width: 12px; height: 12px; left: 75%; animation-delay: 5s; }
.particle:nth-child(5) { width: 10px; height: 10px; left: 90%; animation-delay: 2s; }

@keyframes rise {
    0% { bottom: -50px; opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.3; }
    100% { bottom: 110%; opacity: 0; transform: translateX(50px); }
}

/* Main Container */
.container {
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    padding: 60px 70px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
    position: relative;
    z-index: 1;
    max-width: 650px;
    width: 100%;
    animation: slideUp 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Decorative top bar */
.container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
    background-size: 200% 100%;
    border-radius: 30px 30px 0 0;
    animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Heart Icon */
.icon {
    font-size: 90px;
    margin-bottom: 25px;
    animation: heartbeat 2s ease-in-out infinite;
    display: inline-block;
    filter: drop-shadow(0 5px 15px rgba(239, 68, 68, 0.3));
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    10%, 30% { transform: scale(1.1); }
    20% { transform: scale(0.95); }
}

/* Title */
h1 {
    margin-bottom: 15px;
    color: #1e293b;
    font-size: 2.8rem;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -1px;
    transition: all 0.5s ease;
}

.gradient-text {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 3s ease infinite;
}

@keyframes gradientShift {
    0%, 100% { background-position: 0% center; }
    50% { background-position: 100% center; }
}

/* Subtitle */
.subtitle {
    color: #64748b;
    font-size: 1.15rem;
    margin-bottom: 45px;
    font-weight: 500;
    line-height: 1.6;
}

/* Button Container */
.btn-group {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 40px;
}

/* Buttons */
.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 45px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    font-size: 17px;
    color: white;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden;
    letter-spacing: 0.3px;
}

.btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
}

.btn:hover::before {
    width: 300px;
    height: 300px;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}

.btn-primary:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
}

.btn-secondary {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
}

.btn-secondary:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 12px 35px rgba(245, 87, 108, 0.6);
}

.btn:active {
    transform: translateY(-2px) scale(1.02);
}

.btn span {
    position: relative;
    z-index: 1;
}

/* Features Grid */
.features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 10px;
}

.feature {
    padding: 25px 15px;
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    border-radius: 18px;
    transition: all 0.3s ease;
    cursor: default;
    border: 2px solid transparent;
}

.feature:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 30px rgba(102, 126, 234, 0.25);
    border-color: rgba(102, 126, 234, 0.3);
}

.feature-icon {
    font-size: 40px;
    margin-bottom: 12px;
    display: inline-block;
    animation: bounce 2s ease-in-out infinite;
}

.feature:nth-child(2) .feature-icon {
    animation-delay: 0.2s;
}

.feature:nth-child(3) .feature-icon {
    animation-delay: 0.4s;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.feature-text {
    color: #475569;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Stats Counter */
.stats {
    display: flex;
    justify-content: space-around;
    margin-top: 40px;
    padding-top: 30px;
    border-top: 2px solid #e2e8f0;
}

.stat {
    text-align: center;
}

.stat-number {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.stat-label {
    font-size: 13px;
    color: #64748b;
    font-weight: 600;
    margin-top: 5px;
}

/* Responsive Design */
@media (max-width: 768px) {
    .container {
        padding: 45px 35px;
    }
    
    h1 {
        font-size: 2.2rem;
    }
    
    .icon {
        font-size: 70px;
    }
    
    .btn-group {
        flex-direction: column;
    }
    
    .btn {
        width: 100%;
    }
    
    .features {
        grid-template-columns: 1fr;
        gap: 15px;
    }
}

@media (max-width: 480px) {
    h1 {
        font-size: 1.8rem;
    }
    
    .subtitle {
        font-size: 1rem;
    }
    
    .container {
        padding: 35px 25px;
    }
    
    .stats {
        flex-direction: column;
        gap: 20px;
    }
}
</style>
</head>

<body>

<!-- Floating Particles -->
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<div class="container">
    <div class="icon">❤️</div>
    <h1 id="title">
        Welcome to<br>
        <span class="gradient-text">Smart Donation Hub</span>
    </h1>
    <p class="subtitle">Join our community of changemakers and make an impact that matters</p>
    
    <div class="btn-group">
        <a href="/login/" class="btn btn-primary">
            <span>Login</span>
        </a>
        <a href="/register/" class="btn btn-secondary">
            <span>Register</span>
        </a>
    </div>
    
    <div class="features">
        <div class="feature">
            <div class="feature-icon">🤝</div>
            <div class="feature-text">Connect</div>
        </div>
        <div class="feature">
            <div class="feature-icon">💝</div>
            <div class="feature-text">Donate</div>
        </div>
        <div class="feature">
            <div class="feature-icon">🌟</div>
            <div class="feature-text">Impact</div>
        </div>
    </div>
    
    <div class="stats">
        <div class="stat">
            <div class="stat-number" data-target="500">0</div>
            <div class="stat-label">Donors</div>
        </div>
        <div class="stat">
            <div class="stat-number" data-target="50">0</div>
            <div class="stat-label">NGOs</div>
        </div>
        <div class="stat">
            <div class="stat-number" data-target="1000">0</div>
            <div class="stat-label">Lives Impacted</div>
        </div>
    </div>
</div>

<script>
// Animated title change
window.onload = function () {
    setTimeout(() => {
        const title = document.getElementById("title");
        title.innerHTML = 'Together We Can<br><span class="gradient-text">Make a Difference ❤️</span>';
    }, 2000);
    
    // Animate stats counter
    animateStats();
};

// Stats counter animation
function animateStats() {
    const stats = document.querySelectorAll('.stat-number');
    
    stats.forEach(stat => {
        const target = parseInt(stat.getAttribute('data-target'));
        const duration = 2000;
        const increment = target / (duration / 16);
        let current = 0;
        
        const timer = setInterval(() => {
            current += increment;
            if (current >= target) {
                stat.textContent = target + '+';
                clearInterval(timer);
            } else {
                stat.textContent = Math.floor(current);
            }
        }, 16);
    });
}

// Add ripple effect on button click
document.querySelectorAll('.btn').forEach(button => {
    button.addEventListener('click', function(e) {
        let ripple = document.createElement('span');
        ripple.classList.add('ripple');
        this.appendChild(ripple);
        
                setTimeout(() => ripple.remove(), 600);
    });
});
</script>

</body>
</html>
